name: Verify 7396 Ray error propagation

permissions:
  contents: read

on:
  push:
    branches:
      - verify/7396-control
      - verify/7396-current-fix
      - verify/7396-candidate-fix
      - verify/7396-final-state-machine
  workflow_dispatch:

env:
  DAFT_ANALYTICS_ENABLED: "0"
  DAFT_PROGRESS_BAR: "0"
  RUST_BACKTRACE: "1"
  DAFT_RUNNER: ray

jobs:
  verify-python-310-ray:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Record tested revision
        run: |
          git rev-parse HEAD
          git log -5 --oneline

      - uses: moonrepo/setup-rust@v1
        with:
          cache: false

      - uses: taiki-e/install-action@cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.7.1

      - name: Install LLVM tools
        run: rustup component add llvm-tools-preview

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up virtual environment
        run: |
          uv venv --seed .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Detect Conda home
        run: |
          if command -v conda >/dev/null 2>&1; then
            echo "CONDA_HOME=$(conda info --base)" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: uv sync --no-install-project --all-extras --all-groups

      - name: Match CI PyArrow version
        run: uv pip install pyarrow==22.0.0

      - name: Build hello extension
        run: cargo build --release --manifest-path examples/hello/Cargo.toml

      - name: Build coverage-instrumented library
        run: |
          source .venv/bin/activate
          cargo llvm-cov clean --workspace
          maturin develop --uv
        env:
          RUSTFLAGS: -C instrument-coverage --cfg=coverage --cfg=coverage_nightly --cfg=trybuild_no_target
          LLVM_PROFILE_FILE: ./target/daft-coverage-%p-%m.profraw
          CARGO_LLVM_COV: "1"
          CARGO_LLVM_COV_SHOW_ENV: "1"
          CARGO_LLVM_COV_TARGET_DIR: ./target
          CARGO_TARGET_DIR: ./target

      - name: Repeat focused Ray error test
        run: |
          set -o pipefail
          source .venv/bin/activate
          for attempt in $(seq 1 5); do
            echo "===== focused attempt ${attempt}/5 ====="
            timeout --signal=TERM --kill-after=30s 120s \
              pytest -n 0 --cov=daft -vv -s \
              tests/expressions/test_utf8.py::test_split_part_zero_errors
          done
        env:
          RAY_CONDA_HOME: ${{ env.CONDA_HOME }}
          CONDA_EXE: ${{ env.CONDA_HOME }}/bin/conda
          RUSTFLAGS: -C instrument-coverage --cfg=coverage --cfg=coverage_nightly --cfg=trybuild_no_target
          LLVM_PROFILE_FILE: ./target/daft-coverage-%p-%m.profraw
          CARGO_TARGET_DIR: ./target

      - name: Run CI-equivalent Python 3.10 Ray unit suite
        run: |
          set -o pipefail
          source .venv/bin/activate
          pytest --ignore tests/integration --collect-only -qq
          timeout --signal=TERM --kill-after=30s 2400s \
            pytest -n 4 --cov=daft --ignore tests/integration --durations=0 \
            2>&1 | tee pytest_output.txt
        env:
          RAY_CONDA_HOME: ${{ env.CONDA_HOME }}
          CONDA_EXE: ${{ env.CONDA_HOME }}/bin/conda
          RUSTFLAGS: -C instrument-coverage --cfg=coverage --cfg=coverage_nightly --cfg=trybuild_no_target
          LLVM_PROFILE_FILE: ./target/daft-coverage-%p-%m.profraw
          CARGO_TARGET_DIR: ./target

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-7396-ray-error-${{ matrix.repetition }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            pytest_output.txt
            /tmp/ray/session_latest/logs
